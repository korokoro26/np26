<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>ネットプリント共有</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Vue.js 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Vueマウント前の未コンパイル構文（{{ }}）の露出防止 */
    [v-cloak] {
      display: none !important;
    }

    /* Apple HIG準拠：システムフォント・タッチフィードバック最適化 */
    :root {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    input, textarea, select {
      user-select: text;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* =========================================================================
       【改善実装】画像には一切影響を与えず、「枠の周囲と外周グローのみ」を
       ゲーミングカラーで光らせるスタイル（overflow-hiddenによる切り落としを回避し、
       画像コンテナと外周リング・グローレイヤーを構造的に分離）
       ========================================================================= */
    @keyframes gamingGlowPulse {
      0%, 100% {
        box-shadow:
          0 0 0 2px rgba(255, 42, 133, 0.9),
          0 0 12px rgba(255, 42, 133, 0.65),
          0 0 24px rgba(0, 229, 255, 0.45);
      }
      50% {
        box-shadow:
          0 0 0 2px rgba(0, 229, 255, 0.95),
          0 0 16px rgba(0, 229, 255, 0.75),
          0 0 30px rgba(157, 78, 221, 0.55);
      }
    }

    @keyframes gamingRingSlide {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* 一覧タイル枠の外周リング（画像には非干渉） */
    .gaming-tile-outer {
      position: relative;
      z-index: 15;
      border-radius: 0.75rem; /* rounded-xl */
      padding: 3px; /* 枠線の周囲の太さ */
      background: linear-gradient(120deg, #ff2a85, #ff9900, #ffee00, #00e676, #00e5ff, #9d4edd, #ff2a85);
      background-size: 300% 300%;
      animation: gamingRingSlide 3.6s ease infinite, gamingGlowPulse 2.4s ease-in-out infinite;
    }

    /* モーダル枠の外周リング（画像・内部コンテンツには非干渉） */
    .gaming-modal-outer {
      position: relative;
      border-radius: 1rem; /* rounded-2xl */
      padding: 3.5px; /* モーダル周囲の枠太さ */
      background: linear-gradient(120deg, #ff2a85, #ff9900, #ffee00, #00e676, #00e5ff, #9d4edd, #ff2a85);
      background-size: 300% 300%;
      animation: gamingRingSlide 3.6s ease infinite, gamingGlowPulse 2.4s ease-in-out infinite;
    }

    .gaming-pill-accent {
      background: linear-gradient(90deg, #ff2a85, #ff9900, #00e676, #00e5ff, #9d4edd);
      background-size: 250% 250%;
      animation: gamingRingSlide 3.6s ease infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col">
  <div id="app" v-cloak class="flex-1 flex flex-col min-h-screen">
    
    <!-- ナビゲーションバー (Dynamic Island回避・文字折り返し防止・省スペース設計) -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-3 sm:px-6 lg:px-8 pb-2.5 flex items-center justify-between gap-2 transition-all"
            style="padding-top: max(env(safe-area-inset-top, 0px) + 0.5rem, 2.75rem);">
      <!-- 左側：アプリアイコン -->
      <div class="flex items-center gap-1.5 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-xs">
          <i data-lucide="printer" class="w-4 h-4"></i>
        </div>
        <span class="hidden sm:inline text-[10px] text-slate-300 font-mono tracking-tighter select-none">v1.7.5</span>
      </div>

      <!-- 中央：グリッド列数切り替え (1列 / 2列 / 3列 - 折り返し完全防止) -->
      <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200/70 shrink-0">
        <button 
          type="button"
          v-for="col in [1, 2, 3]" 
          :key="col"
          @click="setGridCols(col)"
          :class="gridCols === col ? 'bg-white text-emerald-700 shadow-2xs font-bold' : 'text-slate-500 hover:text-slate-700 font-medium'"
          class="h-8 px-3 rounded-lg text-xs whitespace-nowrap transition flex items-center justify-center gap-1 active:scale-95"
        >
          <i :data-lucide="col === 1 ? 'square' : (col === 2 ? 'columns-2' : 'grid-3x3')" class="w-3.5 h-3.5 shrink-0"></i>
          <span v-text="col + '列'" class="whitespace-nowrap"></span>
        </button>
      </div>

      <!-- 右側：登録ボタン -->
      <button @click="openModal()" 
              class="h-9 px-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold text-xs rounded-xl shadow-xs whitespace-nowrap transition flex items-center gap-1 shrink-0">
        <i data-lucide="plus" class="w-4 h-4 shrink-0"></i>
        <span>登録する</span>
      </button>
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="flex-1 max-w-5xl w-full mx-auto pb-8">
      
      <!-- 省スペース型フィルタエリア（タグ絞り込み & 登録月絞り込みを1行に集約） -->
      <section v-if="sortedTagsWithCount.length > 0 || sortedMonthsWithCount.length > 0" class="px-3 sm:px-4 pt-2.5 pb-2 space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <!-- タグで絞り込むトリガーボタン -->
          <button 
            v-if="sortedTagsWithCount.length > 0"
            type="button"
            @click="toggleTagAccordion" 
            :class="[
              'px-3 py-2 rounded-xl border text-xs font-medium flex items-center justify-between gap-1.5 transition shadow-2xs',
              selectedTag || isTagAccordionOpen ? 'bg-emerald-50/80 border-emerald-300 text-emerald-800' : 'bg-white border-slate-200/80 text-slate-600 hover:bg-slate-50',
              sortedMonthsWithCount.length === 0 ? 'col-span-2' : ''
            ]"
          >
            <div class="flex items-center gap-1.5 min-w-0">
              <i data-lucide="tag" class="w-3.5 h-3.5 text-emerald-600 shrink-0"></i>
              <span v-if="!selectedTag" class="truncate">タグで絞り込む</span>
              <span v-else class="font-bold text-emerald-700 truncate" v-text="'#' + selectedTag"></span>
            </div>
            <i :data-lucide="isTagAccordionOpen ? 'chevron-up' : 'chevron-down'" class="w-4 h-4 text-slate-400 shrink-0"></i>
          </button>

          <!-- 登録月で絞り込むトリガーボタン -->
          <button 
            v-if="sortedMonthsWithCount.length > 0"
            type="button"
            @click="toggleMonthAccordion" 
            :class="[
              'px-3 py-2 rounded-xl border text-xs font-medium flex items-center justify-between gap-1.5 transition shadow-2xs',
              selectedMonth || isMonthAccordionOpen ? 'bg-emerald-50/80 border-emerald-300 text-emerald-800' : 'bg-white border-slate-200/80 text-slate-600 hover:bg-slate-50',
              sortedTagsWithCount.length === 0 ? 'col-span-2' : ''
            ]"
          >
            <div class="flex items-center gap-1.5 min-w-0">
              <i data-lucide="calendar-days" class="w-3.5 h-3.5 text-emerald-600 shrink-0"></i>
              <span v-if="!selectedMonth" class="truncate">登録月で絞り込む</span>
              <span v-else class="font-bold text-emerald-700 truncate" v-text="formatMonthLabel(selectedMonth)"></span>
            </div>
            <i :data-lucide="isMonthAccordionOpen ? 'chevron-up' : 'chevron-down'" class="w-4 h-4 text-slate-400 shrink-0"></i>
          </button>
        </div>

        <!-- タグ展開パネル（利用頻度・件数順） -->
        <div v-show="isTagAccordionOpen" class="p-2.5 bg-white border border-slate-200/80 rounded-xl shadow-xs">
          <div class="flex flex-wrap gap-1.5 max-h-44 overflow-y-auto no-scrollbar">
            <button 
              type="button"
              @click="selectedTag = ''" 
              :class="selectedTag === '' ? 'bg-emerald-600 text-white font-semibold shadow-2xs' : 'bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100'"
              class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition min-h-[34px]"
            >
              すべて表示
            </button>
            <button 
              type="button"
              v-for="item in sortedTagsWithCount" 
              :key="item.name" 
              @click="toggleTagFilter(item.name)" 
              :class="selectedTag === item.name ? 'bg-emerald-600 text-white font-semibold shadow-2xs' : 'bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100'"
              class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition min-h-[34px] flex items-center gap-1.5"
            >
              <span v-text="'#' + item.name"></span>
              <span 
                :class="selectedTag === item.name ? 'bg-emerald-700 text-emerald-50' : 'bg-slate-200/70 text-slate-600'"
                class="px-1.5 py-0.2 rounded-full text-[10px] font-mono"
                v-text="item.count"
              ></span>
            </button>
          </div>
        </div>

        <!-- 登録月展開パネル（created_atから自動算出） -->
        <div v-show="isMonthAccordionOpen" class="p-2.5 bg-white border border-slate-200/80 rounded-xl shadow-xs">
          <div class="flex flex-wrap gap-1.5 max-h-44 overflow-y-auto no-scrollbar">
            <button 
              type="button"
              @click="selectedMonth = ''" 
              :class="selectedMonth === '' ? 'bg-emerald-600 text-white font-semibold shadow-2xs' : 'bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100'"
              class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition min-h-[34px]"
            >
              全期間
            </button>
            <button 
              type="button"
              v-for="m in sortedMonthsWithCount" 
              :key="m.key" 
              @click="toggleMonthFilter(m.key)" 
              :class="selectedMonth === m.key ? 'bg-emerald-600 text-white font-semibold shadow-2xs' : 'bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100'"
              class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition min-h-[34px] flex items-center gap-1.5"
            >
              <span v-text="m.label"></span>
              <span 
                :class="selectedMonth === m.key ? 'bg-emerald-700 text-emerald-50' : 'bg-slate-200/70 text-slate-600'"
                class="px-1.5 py-0.2 rounded-full text-[10px] font-mono"
                v-text="m.count"
              ></span>
            </button>
          </div>
        </div>
      </section>

      <!-- ローディングスピナー -->
      <section v-if="isLoading" class="text-center py-20">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
        <p class="text-xs text-slate-500 mt-2">クラウドデータを同期中...</p>
      </section>

      <!-- 画像タイル一覧グリッド表示 (ユーザー選択の1列/2列/3列を反映 & 全体表示) -->
      <section 
        v-else-if="filteredPrints.length > 0" 
        :class="[
          'grid px-3 sm:px-4 pt-1 transition-all',
          gridCols === 1 ? 'grid-cols-1 gap-3.5' : (gridCols === 2 ? 'grid-cols-2 gap-2.5' : 'grid-cols-3 gap-1.5 sm:gap-2.5')
        ]"
      >
        <!-- 外周リング＆グロー用ラッパー（要確認対象のみ gaming-tile-outer を付与） -->
        <div 
          v-for="item in filteredPrints" 
          :key="item.id" 
          @click="viewDetail(item)"
          :class="isHighlightedForUser(item) ? 'gaming-tile-outer cursor-pointer select-none' : 'cursor-pointer select-none'"
        >
          <!-- 通常の画像カード本体（画像領域は overflow-hidden で独立） -->
          <div 
            :class="[
              'relative w-full h-full bg-white border border-slate-200/80 rounded-[10px] overflow-hidden group shadow-2xs flex items-center justify-center',
              gridCols === 1 ? 'p-2.5 aspect-[16/11]' : (gridCols === 2 ? 'p-1.5 aspect-[4/3]' : 'p-1 aspect-[4/3]')
            ]"
          >
            <img 
              :src="item.image_url" 
              :alt="item.title" 
              class="w-full h-full object-contain group-hover:scale-[1.03] active:scale-95 transition duration-200"
              loading="lazy"
            >
            <!-- 枠の重要度バッジ（角に配置し画像中央を遮らない） -->
            <div 
              v-if="isHighlightedForUser(item)"
              class="gaming-pill-accent absolute top-1.5 left-1.5 z-20 px-2 py-0.5 rounded-full text-[10px] font-extrabold text-white shadow-sm pointer-events-none"
            >
              要確認
            </div>
            <!-- ホバー・タッチ時のフィードバック -->
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 active:bg-black/15 transition-colors pointer-events-none"></div>
          </div>
        </div>
      </section>

      <!-- 空状態プレースホルダー -->
      <section v-else class="mx-4 mt-3 text-center py-16 px-4 bg-white rounded-2xl border border-dashed border-slate-300">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 mb-3">
          <i data-lucide="image-off" class="w-6 h-6"></i>
        </div>
        <p class="text-sm font-medium text-slate-600">有効なプリント情報がありません</p>
        <p class="text-xs text-slate-400 mt-1">絞り込みを解除するか、「登録する」ボタンから追加してください</p>
        <div class="mt-4 flex items-center justify-center gap-2">
          <button v-if="selectedTag || selectedMonth" @click="selectedTag = ''; selectedMonth = ''" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
            絞り込みを解除
          </button>
          <button @click="openModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl inline-flex items-center gap-1.5 transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新規登録
          </button>
        </div>
      </section>
    </main>

    <!-- 画像タップ時の詳細・ネットプリント番号モーダル（枠周囲のみゲーミング発光・画像には非干渉） -->
    <div 
      v-if="selectedPreview" 
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-4 animate-fade-in"
      @click.self="selectedPreview = null"
    >
      <!-- モーダル外周のゲーミング枠ラッパー -->
      <div 
        :class="[
          'relative max-w-lg w-full max-h-[90vh] flex flex-col',
          selectedPreviewHasHighlight ? 'gaming-modal-outer' : ''
        ]"
      >
        <!-- モーダル本体 -->
        <div class="bg-white rounded-[13px] overflow-hidden shadow-2xl flex flex-col max-h-[calc(90vh-7px)] w-full">
          
          <!-- 詳細モーダルヘッダー（誤タップ防止のため削除アイコンを撤去し、編集画面内へ移動） -->
          <div class="px-4 py-3 bg-white border-b border-slate-100 flex items-start justify-between gap-2 shrink-0">
            <div class="flex-1 min-w-0 py-1">
              <div v-if="selectedPreviewHasHighlight" class="mb-1">
                <span class="gaming-pill-accent inline-block px-2 py-0.5 rounded-full text-[10px] font-extrabold text-white">
                  要確認
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-sm sm:text-base break-words whitespace-normal leading-snug" v-text="selectedPreview.title"></h3>
            </div>
            <div class="flex items-center space-x-1 shrink-0">
              <button 
                @click="openEditFromDetail(selectedPreview)" 
                class="min-h-[40px] min-w-[40px] flex items-center justify-center text-slate-500 hover:text-emerald-600 hover:bg-slate-100 rounded-xl transition" 
                title="編集"
              >
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <div class="w-px h-5 bg-slate-200 mx-0.5"></div>
              <button 
                @click="selectedPreview = null" 
                class="min-h-[40px] min-w-[40px] flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition" 
                title="閉じる"
              >
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
          </div>

          <!-- スクロール可能なコンテンツ領域 -->
          <div class="overflow-y-auto flex-1 flex flex-col">
            <!-- フル画像プレビュー（画像自体にフィルター・光彩効果は適用しない） -->
            <div class="bg-slate-950 flex items-center justify-center min-h-[220px] max-h-[50vh] p-2 relative">
              <img 
                :src="selectedPreview.image_url" 
                :alt="selectedPreview.title" 
                class="max-h-[48vh] max-w-full object-contain rounded"
              >
            </div>

            <!-- ネットプリント予約番号 & メタ詳細 -->
            <div class="p-4 sm:p-5 space-y-4 bg-white">
              
              <!-- 予約番号ボックス (ワンタップコピー機能付き) -->
              <div class="bg-emerald-50/70 border border-emerald-200/80 rounded-2xl p-3.5 flex items-center justify-between">
                <div>
                  <span class="text-[10px] uppercase font-bold tracking-wider text-emerald-700 block mb-0.5">プリント予約番号 (8桁)</span>
                  <span class="font-mono text-2xl sm:text-3xl font-extrabold tracking-widest text-emerald-800 select-all" v-text="selectedPreview.print_number"></span>
                </div>
                <button 
                  @click="copyPrintNumber(selectedPreview.print_number)"
                  class="min-h-[44px] px-3.5 py-2 bg-white hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 rounded-xl text-xs font-semibold shadow-2xs transition active:scale-95 flex items-center gap-1.5"
                >
                  <i data-lucide="copy" class="w-4 h-4"></i>
                  <span>コピー</span>
                </button>
              </div>

              <!-- 登録日・印刷期限メタ行 -->
              <div class="flex flex-wrap gap-2">
                <div v-if="selectedPreview.created_at" class="flex items-center gap-1.5 text-xs text-slate-600 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/60">
                  <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                  <span class="text-slate-500">登録:</span>
                  <span class="font-mono font-medium text-slate-700" v-text="formatCreatedAt(selectedPreview.created_at)"></span>
                </div>
                <div v-if="selectedPreview.expire_date" class="flex items-center gap-1.5 text-xs text-slate-600 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/60">
                  <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-600 shrink-0"></i>
                  <span class="text-slate-500">印刷期限:</span>
                  <span class="font-mono font-semibold text-slate-800" v-text="selectedPreview.expire_date"></span>
                </div>
              </div>

              <!-- 説明 / 印刷設定メモ -->
              <div v-if="selectedPreview.description" class="space-y-1">
                <span class="text-[11px] font-semibold text-slate-400 block">説明・メモ</span>
                <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-100 leading-relaxed select-text" v-text="selectedPreview.description"></p>
              </div>

              <!-- タグ一覧（検索アクションであることが直感的に伝わるインタラクティブピル） -->
              <div v-if="selectedPreview.tags && selectedPreview.tags.length > 0" class="space-y-2 pt-1">
                <div class="flex items-center gap-1 text-[11px] font-semibold text-slate-400">
                  <i data-lucide="tag" class="w-3 h-3"></i>
                  <span>タグ</span>
                </div>
                <div class="flex flex-wrap gap-2">
                  <button 
                    v-for="t in selectedPreview.tags" 
                    :key="t" 
                    @click="filterByTagFromModal(t)"
                    class="group inline-flex items-center gap-1.5 text-xs bg-emerald-50/70 hover:bg-emerald-600 text-emerald-800 hover:text-white border border-emerald-200/90 hover:border-emerald-600 pl-2.5 pr-2 py-1.5 rounded-full font-semibold shadow-2xs active:scale-95 transition"
                  >
                    <i data-lucide="search" class="w-3 h-3 text-emerald-600 group-hover:text-white transition-colors"></i>
                    <span v-text="'#' + t"></span>
                    <i data-lucide="chevron-right" class="w-3 h-3 text-emerald-400 group-hover:text-white/90 -ml-0.5 transition-colors"></i>
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 登録・編集モーダル -->
    <div 
      v-if="isModalOpen" 
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 overflow-y-auto animate-fade-in"
      @click.self="closeModal()"
      @paste="handlePaste"
    >
      <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-lg w-full overflow-hidden flex flex-col my-auto max-h-[92vh]">
        <!-- モーダルヘッダー -->
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between shrink-0">
          <h3 class="font-semibold text-slate-800 text-base" v-text="isEditing ? 'プリント情報の編集' : '新規プリント登録'"></h3>
          <button @click="closeModal()" class="min-h-[44px] min-w-[44px] flex items-center justify-center text-slate-400 hover:text-slate-600 rounded-lg">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- フォーム本体 -->
        <form @submit.prevent="savePrint" class="p-6 space-y-4 overflow-y-auto flex-1">
          <!-- 画像選択/貼り付けボタンエリア -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-medium text-slate-700">
                プリント対象の画像 <span class="text-rose-500">*</span>
              </label>
              <button 
                type="button"

                class="min-h-[36px] px-2.5 py-1 text-xs font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/80 rounded-lg flex items-center gap-1.5 transition active:scale-95"
              >
                <i data-lucide="clipboard" class="w-3.5 h-3.5"></i>
                <span>スクショを貼り付け</span>
              </button>
            </div>

            <div 
              @click="$refs.fileInput.click()" 
              class="border-2 border-dashed border-slate-200 hover:border-emerald-400 rounded-xl p-4 text-center cursor-pointer bg-slate-50/50 hover:bg-emerald-50/20 transition flex flex-col items-center justify-center min-h-[130px]"
            >
              <input 
                type="file"

                @change="handleFileUpload"

              >
              <template v-if="previewImage">

                <span class="text-xs text-emerald-600 font-medium">タップして画像を変更（または右上の貼り付けボタン）</span>
              </template>
              <template v-else>
                <i data-lucide="image-plus" class="w-8 h-8 text-slate-400 mb-2"></i>

                <span class="text-[11px] text-slate-400 mt-0.5">ショートカットキー（⌘V / Ctrl+V）でも直接貼付可能</span>
              </template>
            </div>
          </div>

          <!-- タイトル -->
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">タイトル <span class="text-rose-500">*</span></label>
            <input 
              v-model="formData.title" 
              type="text" 
              required
              placeholder="例: イラストL判 / チラシ" 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
            >
          </div>

          <!-- ネットプリント予約番号（8桁半角数字限定） -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-medium text-slate-700">
                プリント予約番号 (半角数字8桁) <span class="text-rose-500">*</span>
              </label>
              <span class="text-[11px] font-mono" :class="formData.print_number.length === 8 ? 'text-emerald-600 font-semibold' : 'text-slate-400'">
                <span v-text="formData.print_number.length"></span> / 8桁
              </span>
            </div>
            <input 
              :value="formData.print_number" 
              @input="handlePrintNumberInput"
              type="text" 
              inputmode="numeric"
              pattern="[0-9]{8}"
              maxlength="8"
              required
              placeholder="例: 12345678" 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-base tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
            >
          </div>

          <!-- タグ登録（既存タグのプルダウン＆チップ選択 ＋ 新規自由入力） -->
          <div class="space-y-2">
            <label class="block text-xs font-medium text-slate-700">タグ (既存のタグから選択、または新規入力)</label>
            
            <!-- 既存タグプルダウン & ワンタップチップ (表記ゆれ防止) -->
            <div v-if="allSavedTagsForForm.length > 0" class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5 space-y-2">
              <div class="flex items-center gap-2">
                <div class="relative flex-1">
                  <select 
                    @change="handleSelectExistingTag" 
                    class="w-full pl-3 pr-8 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 focus:outline-none focus:border-emerald-500 appearance-none"
                  >
                    <option value="">＋ 既存のタグをプルダウンから選ぶ...</option>
                    <option 
                      v-for="item in allSavedTagsForForm" 
                      :key="item.name" 
                      :value="item.name"
                      v-text="`#${item.name} (${item.count}件)`"
                    ></option>
                  </select>
                  <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
              </div>

              <!-- よく使うタグのクイック選択チップ -->
              <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto no-scrollbar pt-0.5">
                <button
                  type="button"
                  v-for="item in allSavedTagsForForm"
                  :key="item.name"
                  @click="toggleTagInForm(item.name)"
                  :class="isTagInForm(item.name) ? 'bg-emerald-600 text-white border-emerald-600 font-semibold' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'"
                  class="px-2.5 py-1 rounded-lg text-[11px] border transition flex items-center gap-1 active:scale-95"
                >
                  <i :data-lucide="isTagInForm(item.name) ? 'check' : 'plus'" class="w-3 h-3"></i>
                  <span v-text="item.name"></span>
                </button>
              </div>
            </div>

            <!-- 自由入力欄（新規タグもそのまま追加可能） -->
            <input 
              v-model="formData.tagsInput" 
              type="text" 
              placeholder="新規タグを入力 (スペースやカンマ区切りで複数可)" 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
            >
          </div>

          <!-- 有効期限 -->
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              印刷期限 (任意・設定した日付になると一覧から自動で非表示になります)
            </label>
            <input 
              v-model="formData.expire_date" 
              type="date" 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"
            >
          </div>

          <!-- 説明・備考 (Shift+Enter送信ガイド付) -->
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">説明 / 印刷設定メモ (用紙サイズ・カラー等)</label>
            <textarea 
              v-model="formData.description" 
              rows="3" 
              @keydown="handleTextareaKeydown"
              placeholder="例: 写真用紙 / カラー / 40円 (Shift + Enter で送信)" 
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 resize-none"
            ></textarea>
            <span class="text-[10px] text-slate-400 block mt-0.5 text-right">送信: Shift + Enter</span>
          </div>

          <!-- 【改善実装】編集時：枠の周囲と外周グローのみをゲーミングカラーで光らせるスイッチ -->
          <div v-if="isEditing" class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 flex items-center justify-between gap-3">
            <div class="space-y-0.5">
              <span class="block text-xs font-semibold text-slate-800">枠の周囲をゲーミングカラーで光らせる</span>
              <span class="block text-[11px] text-slate-500">画像には影響せず枠線周囲と外周グローのみ発光させ重要性を伝えます</span>
            </div>
            <label class="inline-flex items-center cursor-pointer shrink-0">
              <input type="checkbox" v-model="formData.highlight_for_user" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600 relative"></div>
            </label>
          </div>

          <!-- アクションボタン（編集時は左側に削除ボタンを配置） -->
          <div class="pt-3 flex items-center justify-between gap-2 border-t border-slate-100">
            <button 
              v-if="isEditing"
              type="button" 
              @click="deleteFromEdit()" 
              :disabled="isSubmitting"
              class="min-h-[44px] px-3.5 py-2 text-rose-600 hover:bg-rose-50 border border-rose-200/80 rounded-xl text-sm font-medium transition active:scale-95 disabled:opacity-50 flex items-center gap-1.5"
            >
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              <span>削除</span>
            </button>

            <div class="flex items-center space-x-2 ml-auto">
              <button 
                type="button" 
                @click="closeModal()" 
                :disabled="isSubmitting"
                class="min-h-[44px] px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-medium transition disabled:opacity-50"
              >
                キャンセル
              </button>
              <button 
                type="submit" 
                :disabled="isSubmitting"
                class="min-h-[44px] px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl shadow-sm transition active:scale-95 disabled:opacity-50 flex items-center gap-1.5"
              >
                <div v-if="isSubmitting" class="animate-spin rounded-full h-3.5 w-3.5 border-2 border-white border-t-transparent"></div>
                <span v-text="isSubmitting ? '保存中...' : (isEditing ? '更新する' : '保存する')"></span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- トースト通知 -->
    <div 
      v-if="toastMessage" 
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-lg flex items-center space-x-2 animate-bounce-short"
    >
      <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
      <span v-text="toastMessage"></span>
    </div>

  </div>

  <script>
    /**
     * Supabase クライアント初期化 (変更なし)
     */
    const SUPABASE_URL = 'https://vlkzrlelwferqbfzgbwm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VZZGz6LZvrWBIkAyjA8wOA_b3Jj0lOl';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    /**
     * IndexedDB キャッシュ用ラッパー (変更なし)
     */
    const DB_NAME = 'NetPrintHubDB';
    const DB_VERSION = 2;
    const STORE_NAME = 'prints';

    function initDB() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('created_at', 'created_at', { unique: false });
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject('IndexedDB接続エラー: ' + e.target.error);
        } catch (e) {
          reject(e);
        }
      });
    }

    const { createApp, ref, computed, onMounted, nextTick } = Vue;

    createApp({
      setup() {
        const db = ref(null);
        const prints = ref([]);
        const selectedTag = ref('');
        const selectedMonth = ref('');
        const isTagAccordionOpen = ref(false);
        const isMonthAccordionOpen = ref(false);
        
        // グリッド列数（デフォルト2列、ローカルストレージから復元）
        const savedCols = Number(localStorage.getItem('netprint_grid_cols'));
        const gridCols = ref([1, 2, 3].includes(savedCols) ? savedCols : 2);

        const isModalOpen = ref(false);
        const isEditing = ref(false);
        const isLoading = ref(true);
        const isSubmitting = ref(false);
        const selectedPreview = ref(null);
        const toastMessage = ref('');
        
        const previewImage = ref('');
        const pendingImageFile = ref(null);
        const formData = ref({
          id: null,
          title: '',
          print_number: '',
          tagsInput: '',
          image_url: '',
          expire_date: '',
          description: '',
          created_at: null,
          highlight_for_user: false
        });

        // 【改善実装】DB列の有無にかかわらず確実に保持・同期するためのローカルハイライトIDセット
        const localHighlightIds = ref(new Set());

        const isHighlightedForUser = (item) => {
          if (!item) return false;
          if (item.highlight_for_user === true) return true;
          return localHighlightIds.value.has(item.id);
        };

        const selectedPreviewHasHighlight = computed(() => {
          return isHighlightedForUser(selectedPreview.value);
        });

        const renderIcons = () => {
          nextTick(() => {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
              window.lucide.createIcons();
            }
          });
        };

        const setGridCols = (col) => {
          gridCols.value = col;
          try {
            localStorage.setItem('netprint_grid_cols', String(col));
          } catch (e) {}
          renderIcons();
        };

        const showToast = (msg) => {
          toastMessage.value = msg;
          renderIcons();
          setTimeout(() => {
            toastMessage.value = '';
          }, 3000);
        };

        // 今日のローカル日付文字列 (YYYY-MM-DD) を取得
        const getTodayDateString = () => {
          const now = new Date();
          const y = now.getFullYear();
          const m = String(now.getMonth() + 1).padStart(2, '0');
          const d = String(now.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        };

        // 印刷期限の日になっている（または過ぎている）かを判定
        // expire_date が設定されており、今日の日付が expire_date 当日以降 (today >= expire_date) の場合は非表示対象
        const isExpiredPrint = (item) => {
          if (!item || !item.expire_date) return false;
          const expireStr = String(item.expire_date).trim().slice(0, 10);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(expireStr)) return false;
          const todayStr = getTodayDateString();
          return todayStr >= expireStr;
        };

        // 有効な（印刷期限が来ていない）プリント一覧
        const activePrints = computed(() => {
          return prints.value.filter(p => !isExpiredPrint(p));
        });

        const syncToIndexedDB = async (items) => {
          if (!db.value) return;
          try {
            const tx = db.value.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            items.forEach(item => store.put(item));
          } catch (e) {
            console.error('IndexedDB 同期警告:', e);
          }
        };

        // 【改善実装】Supabase再取得時にもローカル保持中のハイライト状態をマージして見失わないようにする
        const mergeHighlightState = (items) => {
          return items.map(item => {
            if (item.highlight_for_user === true) {
              localHighlightIds.value.add(item.id);
              return item;
            }
            if (localHighlightIds.value.has(item.id)) {
              return { ...item, highlight_for_user: true };
            }
            return item;
          });
        };

        const loadPrints = async () => {
          // IndexedDBキャッシュ先行読み込み
          if (db.value) {
            try {
              const tx = db.value.transaction(STORE_NAME, 'readonly');
              const store = tx.objectStore(STORE_NAME);
              const req = store.getAll();
              req.onsuccess = () => {
                if (req.result && req.result.length > 0) {
                  prints.value = mergeHighlightState(req.result).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                  isLoading.value = false;
                  renderIcons();
                }
              };
            } catch (err) {
              console.warn('キャッシュ読み込み:', err);
            }
          }

          // Supabaseから最新取得
          if (supabaseClient) {
            try {
              const { data, error } = await supabaseClient
                .from('prints')
                .select('*')
                .order('created_at', { ascending: false });

              if (error) throw error;

              if (data) {
                const merged = mergeHighlightState(data);
                prints.value = merged;
                syncToIndexedDB(merged);
              }
            } catch (err) {
              console.error(err);
              if (prints.value.length === 0) {
                alert('クラウドデータの取得に失敗しました。ローカルキャッシュを表示します。\n理由: ' + (err.message || err));
              }
            }
          }
          isLoading.value = false;
          renderIcons();
        };

        // Supabase Realtime リスナー
        const setupRealtime = () => {
          if (!supabaseClient) return;

          supabaseClient
            .channel('public:prints')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'prints' }, (payload) => {
              if (payload.eventType === 'INSERT') {
                if (!prints.value.some(p => p.id === payload.new.id)) {
                  prints.value.unshift(payload.new);
                  showToast('新しいプリント情報が追加されました');
                }
              } else if (payload.eventType === 'UPDATE') {
                const index = prints.value.findIndex(p => p.id === payload.new.id);
                if (index !== -1) {
                  prints.value[index] = payload.new;
                }
                if (selectedPreview.value && selectedPreview.value.id === payload.new.id) {
                  if (isExpiredPrint(payload.new)) {
                    selectedPreview.value = null;
                  } else {
                    selectedPreview.value = payload.new;
                  }
                }
              } else if (payload.eventType === 'DELETE') {
                prints.value = prints.value.filter(p => p.id === payload.old.id);
                if (selectedPreview.value && selectedPreview.value.id === payload.old.id) {
                  selectedPreview.value = null;
                }
              }
              renderIcons();
            })
            .subscribe();
        };

        const processImageFile = (file) => {
          if (!file) return;
          if (!file.type || !file.type.startsWith('image/')) {
            alert('画像ファイルを選択またはペーストしてください。');
            return;
          }
          pendingImageFile.value = file;
          const reader = new FileReader();
          reader.onload = (event) => {
            previewImage.value = event.target.result;
            renderIcons();
          };
          reader.onerror = () => {
            alert('画像の読み込みに失敗しました。');
          };
          reader.readAsDataURL(file);
        };

        const handleFileUpload = (e) => {
          const file = e.target.files[0];
          processImageFile(file);
        };

        const handlePaste = (e) => {
          const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
          if (!items) return;
          for (const item of items) {
            if (item.type && item.type.indexOf('image') !== -1) {
              const file = item.getAsFile();
              if (file) {
                processImageFile(file);
                showToast('スクショ画像を貼り付けました');
                break;
              }
            }
          }
        };

        const pasteFromClipboard = async () => {
          if (!navigator.clipboard || !navigator.clipboard.read) {
            alert('お使いのブラウザはボタン操作によるクリップボード読み取りに対応していません。キーボードの ⌘V または Ctrl+V をご利用ください。');
            return;
          }

          try {
            const clipboardItems = await navigator.clipboard.read();
            let foundImage = false;

            for (const item of clipboardItems) {
              const imageType = item.types.find(type => type.startsWith('image/'));
              if (imageType) {
                const blob = await item.getType(imageType);
                processImageFile(blob);
                foundImage = true;
                showToast('クリップボードから画像を貼り付けました');
                break;
              }
            }

            if (!foundImage) {
              alert('クリップボードに画像が見つかりませんでした。スクリーンショットをコピーした状態でもう一度お試しください。');
            }
          } catch (err) {
            alert('クリップボードの読み取りに失敗しました。ブラウザのアクセス権限を確認するか、ショートカットキー（⌘V / Ctrl+V）をご利用ください。\n理由: ' + err);
          }
        };

        const handlePrintNumberInput = (e) => {
          let val = e.target.value
            .replace(/[０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
            .replace(/\D/g, '')
            .slice(0, 8);
          formData.value.print_number = val;
          e.target.value = val;
        };

        // フォーム内のタグ配列取得ヘルパー
        const parseFormTags = () => {
          return Array.from(new Set(
            (formData.value.tagsInput || '')
              .replace(/#/g, '')
              .split(/[\s,、]+/)
              .map(t => t.trim())
              .filter(t => t.length > 0)
          ));
        };

        const isTagInForm = (tagName) => {
          return parseFormTags().includes(tagName);
        };

        const toggleTagInForm = (tagName) => {
          const current = parseFormTags();
          if (current.includes(tagName)) {
            formData.value.tagsInput = current.filter(t => t !== tagName).join(' ');
          } else {
            current.push(tagName);
            formData.value.tagsInput = current.join(' ');
          }
          renderIcons();
        };

        const handleSelectExistingTag = (e) => {
          const val = e.target.value;
          if (!val) return;
          const current = parseFormTags();
          if (!current.includes(val)) {
            current.push(val);
            formData.value.tagsInput = current.join(' ');
          }
          e.target.value = '';
          renderIcons();
        };

        const openModal = () => {
          isEditing.value = false;
          previewImage.value = '';
          pendingImageFile.value = null;
          formData.value = {
            id: null,
            title: '',
            print_number: '',
            tagsInput: '',
            image_url: '',
            expire_date: '',
            description: '',
            created_at: null,
            highlight_for_user: false
          };
          isModalOpen.value = true;
          renderIcons();
        };

        const closeModal = () => {
          if (isSubmitting.value) return;
          isModalOpen.value = false;
        };

        const editPrint = (item) => {
          isEditing.value = true;
          previewImage.value = item.image_url;
          pendingImageFile.value = null;
          formData.value = {
            ...item,
            tagsInput: item.tags ? item.tags.join(' ') : '',
            highlight_for_user: isHighlightedForUser(item)
          };
          isModalOpen.value = true;
          renderIcons();
        };

        // 詳細モーダルから編集を開く
        const openEditFromDetail = (item) => {
          selectedPreview.value = null;
          editPrint(item);
        };

        // 編集モーダルから削除を実行
        const deleteFromEdit = async () => {
          if (!formData.value.id) return;
          const deleted = await confirmDelete(formData.value.id, formData.value.image_url);
          if (deleted) {
            isModalOpen.value = false;
            selectedPreview.value = null;
          }
        };

        // 予約番号のワンタップコピー
        const copyPrintNumber = async (num) => {
          if (!num) return;
          try {
            await navigator.clipboard.writeText(num);
            showToast(`予約番号 (${num}) をコピーしました`);
          } catch (e) {
            showToast('コピーに失敗しました');
          }
        };

        // 詳細モーダル内のタグをタップした際に絞り込む
        const filterByTagFromModal = (tag) => {
          selectedTag.value = tag;
          selectedPreview.value = null;
          showToast(`「#${tag}」で絞り込みました`);
        };

        const uploadImageToSupabase = async (file) => {
          const ext = file.type?.split('/')[1] || 'png';
          const filePath = `prints/${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${ext}`;
          
          const { data, error } = await supabaseClient.storage
            .from('print-images')
            .upload(filePath, file, { contentType: file.type || 'image/png' });

          if (error) throw error;

          const { data: publicUrlData } = supabaseClient.storage
            .from('print-images')
            .getPublicUrl(filePath);

          return publicUrlData.publicUrl;
        };

        const savePrint = async () => {
          if (!previewImage.value) {
            alert('プリント対象の画像を選択またはペーストしてください。');
            return;
          }
          if (!formData.value.title.trim()) {
            alert('タイトルを入力してください。');
            return;
          }
          const numberPattern = /^[0-9]{8}$/;
          if (!numberPattern.test(formData.value.print_number)) {
            alert('予約番号は半角数字8桁で入力してください。');
            return;
          }

          const tags = parseFormTags();

          isSubmitting.value = true;

          try {
            let finalImageUrl = formData.value.image_url;

            if (pendingImageFile.value) {
              finalImageUrl = await uploadImageToSupabase(pendingImageFile.value);
            }

            const shouldHighlight = isEditing.value ? Boolean(formData.value.highlight_for_user) : false;

            const payload = {
              title: formData.value.title.trim(),
              print_number: formData.value.print_number,
              tags: tags,
              image_url: finalImageUrl,
              expire_date: formData.value.expire_date || null,
              description: formData.value.description ? formData.value.description.trim() : '',
              highlight_for_user: shouldHighlight
            };

            let savedData = null;

            if (isEditing.value) {
              let res = await supabaseClient
                .from('prints')
                .update(payload)
                .eq('id', formData.value.id)
                .select();

              if (res.error && String(res.error.message || '').includes('highlight_for_user')) {
                const { highlight_for_user, ...fallbackPayload } = payload;
                res = await supabaseClient
                  .from('prints')
                  .update(fallbackPayload)
                  .eq('id', formData.value.id)
                  .select();
              }

              if (res.error) throw res.error;
              savedData = { ...(res.data && res.data[0] ? res.data[0] : { ...formData.value, ...payload }), highlight_for_user: shouldHighlight };

              if (shouldHighlight) {
                localHighlightIds.value.add(savedData.id);
              } else {
                localHighlightIds.value.delete(savedData.id);
              }
            } else {
              const { highlight_for_user, ...insertPayload } = payload;
              const { data, error } = await supabaseClient
                .from('prints')
                .insert([insertPayload])
                .select();

              if (error) throw error;
              savedData = data[0];
            }

            if (db.value && savedData) {
              const tx = db.value.transaction(STORE_NAME, 'readwrite');
              tx.objectStore(STORE_NAME).put(savedData);
            }

            closeModal();
            await loadPrints();
            showToast(isEditing.value ? 'プリント情報を更新しました' : '新規プリントを登録しました');
          } catch (err) {
            alert('保存に失敗しました: ' + (err.message || err));
          } finally {
            isSubmitting.value = false;
          }
        };

        const confirmDelete = async (id, imageUrl) => {
          if (!confirm('このプリント情報を削除してもよろしいですか？')) return false;
          isSubmitting.value = true;
          try {
            const { error } = await supabaseClient
              .from('prints')
              .delete()
              .eq('id', id);

            if (error) throw error;

            try {
              if (imageUrl && imageUrl.includes('/print-images/')) {
                const parts = imageUrl.split('/print-images/');
                if (parts[1]) {
                  await supabaseClient.storage.from('print-images').remove([decodeURIComponent(parts[1])]);
                }
              }
            } catch (storageErr) {
              console.warn('ストレージ画像削除スキップ:', storageErr);
            }

            if (db.value) {
              const tx = db.value.transaction(STORE_NAME, 'readwrite');
              tx.objectStore(STORE_NAME).delete(id);
            }

            localHighlightIds.value.delete(id);

            await loadPrints();
            showToast('削除しました');
            return true;
          } catch (err) {
            alert('通信エラーによる削除失敗: ' + (err.message || err));
            return false;
          } finally {
            isSubmitting.value = false;
          }
        };

        const handleTextareaKeydown = (e) => {
          if (e.key === 'Enter' && e.shiftKey) {
            e.preventDefault();
            savePrint();
          }
        };

        const viewDetail = (item) => {
          selectedPreview.value = item;
          renderIcons();
        };

        // created_at から YYYY-MM を抽出するヘルパー
        const extractYearMonth = (dateStr) => {
          if (!dateStr) return null;
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return null;
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          return `${y}-${m}`;
        };

        const formatMonthLabel = (ymKey) => {
          if (!ymKey) return '';
          const [y, m] = ymKey.split('-');
          return `${y}年${Number(m)}月`;
        };

        const formatCreatedAt = (dateStr) => {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return '';
          return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        };

        // 有効な（期限切れでない）プリントから、タグを件数の多い順にソート
        const sortedTagsWithCount = computed(() => {
          const countMap = new Map();
          activePrints.value.forEach(p => {
            if (Array.isArray(p.tags)) {
              p.tags.forEach(t => {
                countMap.set(t, (countMap.get(t) || 0) + 1);
              });
            }
          });
          return Array.from(countMap.entries())
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count);
        });

        // 新規登録フォーム用：過去に一度でも登録された全タグ（表記ゆれ防止用）
        const allSavedTagsForForm = computed(() => {
          const countMap = new Map();
          prints.value.forEach(p => {
            if (Array.isArray(p.tags)) {
              p.tags.forEach(t => {
                countMap.set(t, (countMap.get(t) || 0) + 1);
              });
            }
          });
          return Array.from(countMap.entries())
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count);
        });

        // 有効な（期限切れでない）プリントの登録日時(created_at)から月別リストを新しい月順で集計
        const sortedMonthsWithCount = computed(() => {
          const countMap = new Map();
          activePrints.value.forEach(p => {
            const ym = extractYearMonth(p.created_at);
            if (ym) {
              countMap.set(ym, (countMap.get(ym) || 0) + 1);
            }
          });
          return Array.from(countMap.entries())
            .map(([key, count]) => ({
              key,
              label: formatMonthLabel(key),
              count
            }))
            .sort((a, b) => b.key.localeCompare(a.key));
        });

        const toggleTagAccordion = () => {
          isTagAccordionOpen.value = !isTagAccordionOpen.value;
          if (isTagAccordionOpen.value) isMonthAccordionOpen.value = false;
          renderIcons();
        };

        const toggleMonthAccordion = () => {
          isMonthAccordionOpen.value = !isMonthAccordionOpen.value;
          if (isMonthAccordionOpen.value) isTagAccordionOpen.value = false;
          renderIcons();
        };

        const toggleTagFilter = (tag) => {
          selectedTag.value = (selectedTag.value === tag) ? '' : tag;
          isTagAccordionOpen.value = false;
        };

        const toggleMonthFilter = (ymKey) => {
          selectedMonth.value = (selectedMonth.value === ymKey) ? '' : ymKey;
          isMonthAccordionOpen.value = false;
        };

        // 期限切れを除外した activePrints に対して、タグと登録月の絞り込みを適用
        const filteredPrints = computed(() => {
          const targetTag = selectedTag.value;
          const targetMonth = selectedMonth.value;

          return activePrints.value.filter(p => {
            if (targetTag && (!p.tags || !p.tags.includes(targetTag))) {
              return false;
            }

            if (targetMonth) {
              const ym = extractYearMonth(p.created_at);
              if (ym !== targetMonth) return false;
            }

            return true;
          });
        });

        onMounted(async () => {
          try {
            db.value = await initDB();
          } catch (err) {
            console.warn('IndexedDB非対応環境:', err);
          }
          await loadPrints();
          setupRealtime();
        });

        return {
          prints,
          gridCols,
          setGridCols,
          selectedTag,
          selectedMonth,
          isTagAccordionOpen,
          isMonthAccordionOpen,
          sortedTagsWithCount,
          allSavedTagsForForm,
          sortedMonthsWithCount,
          filteredPrints,
          isModalOpen,
          isEditing,
          isLoading,
          isSubmitting,
          formData,
          previewImage,
          selectedPreview,
          selectedPreviewHasHighlight,
          toastMessage,
          isHighlightedForUser,
          openModal,
          closeModal,
          editPrint,
          openEditFromDetail,
          deleteFromEdit,
          copyPrintNumber,
          filterByTagFromModal,
          isTagInForm,
          toggleTagInForm,
          handleSelectExistingTag,
          savePrint,
          confirmDelete,
          handleFileUpload,
          handlePaste,
          pasteFromClipboard,
          handlePrintNumberInput,
          handleTextareaKeydown,
          viewDetail,
          formatMonthLabel,
          formatCreatedAt,
          toggleTagAccordion,
          toggleMonthAccordion,
          toggleTagFilter,
          toggleMonthFilter
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
